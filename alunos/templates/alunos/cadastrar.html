{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar Aluno</title>
<link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
        <form method="POST">
        {% csrf_token %}
            <h1>Formulário de Cadastro de Alunos</h1>
            <input type="text" name="cpf" placeholder="CPF do aluno" required><br>
            <input type="text" name="matricula" placeholder="Matrícula do aluno" required><br>
            <input type="text" name="nome" placeholder="Nome do aluno" required><br>
            <input type="number" name="idade" placeholder="Idade do aluno"><br>
            <input type="email" name="email" placeholder="Email do aluno"><br>
            <input type="text" name="telefone" placeholder="Telefone do aluno"><br>
            <input type="text" name="endereco" placeholder="Endereço do aluno"><br>
            <input type="submit" value="Cadastrar">
        </form>
</body>
</html>
